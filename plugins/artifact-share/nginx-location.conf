# Nginx location block for the artifact-share download endpoint (task #806).
#
# Add this block to EACH server section (the HTTP:80 and the HTTPS:443 vhost)
# of the Evonic site config, e.g. /etc/nginx/sites-available/<your-site>.conf,
# then run `nginx -t && systemctl reload nginx`.
#
# Rationale:
#   * the path segment after /plugin/artifact-share/dl/ is a short-lived
#     single-use bearer token, so access logging is disabled here to avoid
#     retaining the secret in nginx logs;
#   * downloads stream straight through (unbuffered, cache disabled, gzip off)
#     with a bounded read window so a slow client cannot hold a worker open.

location /plugin/artifact-share/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;

    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    access_log off;
}
