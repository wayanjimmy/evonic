{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/ag-ui.css') }}?v=3">
<div class="p-4 md:p-6">
    <!-- Header -->
    <div class="ag-head flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
        <div class="flex-1 w-full sm:w-auto">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Skills</h2>
            <p class="ag-sub text-sm text-gray-500 mt-1">Manage installable skill packages</p>
        </div>
    </div>

    <!-- Skills Tab -->
    <div id="panel-skills">
        <div class="ag-toolbar flex flex-col sm:flex-row gap-3 mb-6">
            <div class="ag-search-wrap relative">
                <svg class="ag-search-ico" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="search" id="skill-search" name="skill_search_filter" placeholder="Search skills..." oninput="filterSkills()" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" class="ag-search">
            </div>
            <button type="button" onclick="document.getElementById('upload-modal').classList.remove('hidden')" class="ag-btn ag-btn-primary" title="Upload Skill" aria-label="Upload Skill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
                <span class="ag-btn-label">Upload Skill</span>
            </button>
        </div>

        <!-- Enabled Skills Grid -->
        <div id="skills-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <!-- Disabled Skills -->
        <section id="disabled-skills-section" class="hidden mt-8" aria-labelledby="disabled-skills-heading">
            <button type="button" id="disabled-skills-toggle" onclick="toggleDisabledSkills()" class="ag-disabled-bar" aria-expanded="false" aria-controls="disabled-skills-grid">
                <svg id="disabled-skills-chevron" class="ag-disabled-chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                <span id="disabled-skills-heading" class="ag-disabled-label">Disabled Skills</span>
                <span id="disabled-skills-count" class="ag-disabled-count"></span>
            </button>
            <div id="disabled-skills-grid" class="hidden mt-4 grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4"></div>
        </section>

        <div id="empty-state" class="hidden ag-empty">
            <span class="ag-empty-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></span>
            <p class="ag-empty-t">No skills installed</p>
            <p class="ag-empty-s">Upload a skill zip package to get started</p>
            <button type="button" onclick="document.getElementById('upload-modal').classList.remove('hidden')" class="ag-btn ag-btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg><span>Upload Skill</span></button>
        </div>
    </div>

</div>

<!-- Upload Modal -->
<div id="upload-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" onclick="closeUploadModal()"></div>
    <div class="relative ev-modal w-[90%] max-w-[480px]">
        <div class="p-6">
            <h3 class="ev-modal-t">Upload Skill Package</h3>
            <p class="ev-modal-s">Install a skill from a .zip package.</p>
            <div id="drop-zone" class="sk-drop" onclick="document.getElementById('file-input').click()">
                <span class="ag-empty-ic" style="width:2.75rem;height:2.75rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg></span>
                <p class="sk-drop-t">Click or drag &amp; drop a .zip file</p>
                <p id="file-name" class="sk-drop-f"></p>
            </div>
            <input type="file" id="file-input" accept=".zip" class="hidden" onchange="onFileSelected(this)">
        </div>
        <div class="ev-modal-btns px-6 pb-6">
            <button onclick="closeUploadModal()" class="ev-btn">Cancel</button>
            <button id="upload-btn" onclick="uploadSkill()" disabled class="ev-btn ev-btn-primary">Install</button>
        </div>
    </div>
</div>

<script>
let selectedFile = null;
let allSkills = [];

async function loadSkills() {
    const res = await fetch('/api/skills');
    const data = await res.json();
    allSkills = data.skills || [];
    renderSkills();
}

function skillCard(s, enabled) {
    const id = esc(s.id);
    const control = (enabled && s.protected)
        ? '<span class="ag-chip is-muted" title="Core skill — required by the Explore agent and cannot be disabled">Core</span>'
        : mkToggle({ checked: enabled ? !!s.enabled : false, onChange: `toggleSkill('${id}', this.checked)` });
    const chips = [
        s.lazy_tools ? '<span class="ag-chip">Lazy</span>' : '',
        `<span class="ag-chip">${s.tool_count || 0} tool${(s.tool_count || 0) === 1 ? '' : 's'}</span>`,
    ].join('');
    return `
        <div class="ag-card sk-card ${enabled ? '' : 'is-off'}" tabindex="0" role="link" onclick="window.location.href='/skills/${id}'"
             onkeydown="if(event.key==='Enter'){window.location.href='/skills/${id}'}">
            <div class="ag-card-top">
                <span class="tp-ic"><i data-lucide="sparkles"></i></span>
                <div class="ag-title">
                    <div class="ag-name-row"><h3 class="ag-name">${esc(s.name || s.id)}</h3></div>
                    <span class="ag-id">${id}</span>
                </div>
                <div class="sk-toggle" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()">${control}</div>
            </div>
            <p class="ag-desc">${esc(s.description || 'No description')}</p>
            <div class="tp-stats"><span>v${esc(s.version || '?')}</span><span>by ${esc(s.author || 'Unknown')}</span></div>
            <div class="ag-badges">${chips}</div>
        </div>`;
}

function renderSkills() {
    const grid = document.getElementById('skills-grid');
    const disabledSection = document.getElementById('disabled-skills-section');
    const disabledGrid = document.getElementById('disabled-skills-grid');
    const disabledCount = document.getElementById('disabled-skills-count');
    const empty = document.getElementById('empty-state');
    const search = document.getElementById('skill-search').value.toLowerCase().trim();
    const skills = search
        ? allSkills.filter(s => (s.name || s.id).toLowerCase().includes(search) || (s.description || '').toLowerCase().includes(search))
        : allSkills;

    if (skills.length === 0) {
        grid.innerHTML = '';
        disabledGrid.innerHTML = '';
        disabledSection.classList.add('hidden');
        empty.classList.remove('hidden');
        empty.querySelector('p:first-of-type').textContent = search ? 'No skills found' : 'No skills installed';
        empty.querySelector('p:last-of-type').textContent = search ? 'Try a different search term.' : 'Upload a skill zip package to get started';
        return;
    }
    empty.classList.add('hidden');

    const enabledSkills = [];
    const disabledSkills = [];
    skills.forEach(skill => {
        if (skill.enabled !== false && skill.enabled !== 0) {
            enabledSkills.push(skill);
        } else {
            disabledSkills.push(skill);
        }
    });

    grid.innerHTML = enabledSkills.map(s => skillCard(s, true)).join('');
    disabledGrid.innerHTML = disabledSkills.map(s => skillCard(s, false)).join('');
    if (window.refreshLucideIcons) refreshLucideIcons();
    disabledCount.textContent = disabledSkills.length;
    disabledSection.classList.toggle('hidden', disabledSkills.length === 0);
}

function toggleDisabledSkills() {
    const toggle = document.getElementById('disabled-skills-toggle');
    const grid = document.getElementById('disabled-skills-grid');
    const chevron = document.getElementById('disabled-skills-chevron');
    const expanded = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!expanded));
    grid.classList.toggle('hidden', expanded);
    chevron.style.transform = expanded ? '' : 'rotate(90deg)';
}

function filterSkills() {
    renderSkills();
}

async function toggleSkill(skillId, enabled) {
    const res = await fetch(`/api/skills/${skillId}/toggle`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled})
    });
    if (!res.ok) {
        const err = await res.json();
        loadSkills();
        if (err.missing_requires && err.missing_requires.length) {
            const dep = err.missing_requires[0];
            const go = await showConfirm({
                danger: false,
                title: 'Required skill not enabled',
                message: err.error || 'A required skill must be enabled first.',
                confirmText: dep ? `Open ${dep.name}` : 'OK',
                cancelText: 'Close',
            });
            if (go && dep) window.location.href = `/skills/${dep.id}`;
        } else {
            toast.show(err.error || 'Failed to toggle skill', 'error');
        }
    }
}

function onFileSelected(input) {
    selectedFile = input.files[0];
    document.getElementById('file-name').textContent = selectedFile ? selectedFile.name : '';
    document.getElementById('upload-btn').disabled = !selectedFile;
}

async function uploadSkill() {
    if (!selectedFile) return;
    const btn = document.getElementById('upload-btn');
    btn.disabled = true;
    btn.textContent = 'Installing...';

    const form = new FormData();
    form.append('file', selectedFile);

    try {
        const res = await fetch('/api/skills/upload', {method: 'POST', body: form});
        const data = await res.json();
        if (!res.ok || data.error) {
            toast.show(data.error || 'Upload failed', 'error');
            return;
        }
        closeUploadModal();
        loadSkills();
    } catch (e) {
        toast.show('Upload failed: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Install';
    }
}

function closeUploadModal() {
    document.getElementById('upload-modal').classList.add('hidden');
    selectedFile = null;
    document.getElementById('file-input').value = '';
    document.getElementById('file-name').textContent = '';
    document.getElementById('upload-btn').disabled = true;
}

// Drag & drop
const dropZone = document.getElementById('drop-zone');
if (dropZone) {
    ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, ev => {
        ev.preventDefault();
        dropZone.classList.add('is-over');
    }));
    ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, ev => {
        ev.preventDefault();
        dropZone.classList.remove('is-over');
    }));
    dropZone.addEventListener('drop', ev => {
        const file = ev.dataTransfer.files[0];
        if (file && file.name.endsWith('.zip')) {
            selectedFile = file;
            document.getElementById('file-name').textContent = file.name;
            document.getElementById('upload-btn').disabled = false;
        }
    });
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

// DOMContentLoaded guarantees the deferred ui-toggle.js (mkToggle) has run
// before the fetch callback renders — a fast API response can otherwise beat it.
document.addEventListener('DOMContentLoaded', loadSkills);
</script>

{% endblock %}
